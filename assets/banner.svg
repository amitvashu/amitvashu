<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Amit Kumar">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#132A47"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#58A6FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#58A6FF" stop-opacity="0.9"/>
      <stop offset="72%"  stop-color="#1F6FEB" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#58A6FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <style>
      .nm { font: 700 52px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #F0F6FC; }
      .tag { font: 400 19px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #8B949E; letter-spacing: .06em; }
      .mono { font: 500 14px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #58A6FF; }
      .lbl { font: 500 11px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #8B949E; letter-spacing: .08em; }
      .sweep { animation: slide 7s ease-in-out infinite; }
      .bus { stroke-dasharray: 8 6; animation: flow 1.6s linear infinite; }
      .pulse { animation: glow 3.4s ease-in-out infinite; }
      .pulse2 { animation: glow 3.4s ease-in-out infinite; animation-delay: 1.1s; }
      .pulse3 { animation: glow 3.4s ease-in-out infinite; animation-delay: 2.2s; }
      @keyframes slide { 0%,100% { transform: translateX(-380px);} 50% { transform: translateX(1240px);} }
      @keyframes flow  { to { stroke-dashoffset: -28; } }
      @keyframes glow  { 0%,100% { opacity:.25 } 50% { opacity:1 } }
    </style>
  </defs>

  <rect width="1200" height="230" fill="url(#sky)"/>
  <rect width="1200" height="230" fill="url(#grid)"/>
  <rect class="sweep" width="380" height="230" fill="url(#sweep)" opacity="0.5"/>

  <!-- three ECUs hanging off a bus -->
  <path class="bus" d="M900 150 H1140" fill="none" stroke="#58A6FF" stroke-opacity="0.55" stroke-width="1.4"/>
  <path d="M940 150 V96 M1020 150 V96 M1100 150 V96" fill="none" stroke="#58A6FF" stroke-opacity="0.28" stroke-width="1.2"/>
  <rect x="912"  y="62" width="56" height="34" rx="5" fill="#0D1117" stroke="#58A6FF" stroke-opacity="0.5"/>
  <rect x="992"  y="62" width="56" height="34" rx="5" fill="#0D1117" stroke="#58A6FF" stroke-opacity="0.5"/>
  <rect x="1072" y="62" width="56" height="34" rx="5" fill="#0D1117" stroke="#58A6FF" stroke-opacity="0.5"/>
  <text class="lbl" x="940"  y="83" text-anchor="middle">HPC</text>
  <text class="lbl" x="1020" y="83" text-anchor="middle">ZONAL</text>
  <text class="lbl" x="1100" y="83" text-anchor="middle">ECU</text>
  <circle class="pulse"  cx="940"  cy="150" r="3.5" fill="#58A6FF"/>
  <circle class="pulse2" cx="1020" cy="150" r="3.5" fill="#1F6FEB"/>
  <circle class="pulse3" cx="1100" cy="150" r="3.5" fill="#58A6FF"/>

  <text class="nm"  x="72" y="106">Amit Kumar</text>
  <text class="tag" x="75" y="142">Embedded Software &#183; Integration &#183; Test Automation</text>
  <text class="mono" x="75" y="182">build &#8594; flash &#8594; trace &#8594; repeat &#8212; QNX, Yocto Linux, Android Automotive</text>

  <rect x="72" y="158" width="620" height="1.6" fill="url(#rule)"/>
</svg>
